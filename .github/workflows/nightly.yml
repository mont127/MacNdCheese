name: Nightly universal build

# One universal (arm64 + x86_64 in one binary) .dmg per commit to main, published
# as a GitHub prerelease. This is separate from build-universal.yml, which is the
# manually-triggered, matrix (separate arm64/intel artifacts) release process.
# See #104: today's releases only ever shipped a native-arch build; buildapp.sh's
# `universal` case was already there but had never actually been wired into CI —
# worse, buildapp.sh itself silently ignored its architecture argument (see the
# fix in that script), so even running it by hand never really produced one.
#
# The automatic trigger was held from 2026-07-09 (PR #111 review) until v11
# shipped, pending an open question about bundling GPTK under Apple's Game
# Porting Toolkit license. v11 has shipped -- the engine is on 11.16 -- and the
# trigger is restored. Note the engine now carries GPTK 4.0b2 next to 3.0
# (mnc-d3d/d3dm-gptk4), so a published nightly redistributes both toolkits.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-universal
  cancel-in-progress: false

jobs:
  build:
    name: Build universal .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        # See the same step in ci.yml / build-universal.yml.
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sed 's#.*/Xcode_##; s/\.app$//' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "/Applications/Xcode_${LATEST}.app"
          fi
          xcodebuild -version

      - name: Resolve the app version
        id: version
        # Sources/Info.plist declares the version to RELEASE, and is honoured as-is.
        # Bumping an explicit version would throw away the decision someone made when
        # they edited it, so the patch only moves when the plist version has already
        # shipped -- i.e. nobody named a new one since the last release.
        #
        # The odometer matches the plist's own numbering: every component past the
        # major is a single digit that carries into the one on its left when it
        # overflows (10.8.9 -> 10.9.0, 10.9.9 -> 11.0.0).
        #
        # The resolved version is written to the plist before the build so the .app
        # carries it, and committed back only once the release is published (see the
        # last step), so a run that fails to build never moves it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CUR="$(awk '/<key>CFBundleShortVersionString<\/key>/ { getline; gsub(/.*<string>|<\/string>.*/, ""); print; exit }' Sources/Info.plist)"
          case "$CUR" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::could not read a X.Y.Z version out of Sources/Info.plist (got '$CUR')"; exit 1 ;;
          esac

          # Has this version already gone out? Stable tags are vX.Y.Z, nightlies are
          # nightly-vX.Y.Z-<date>-<sha>. case patterns match the dots literally.
          RELEASED=false
          while read -r t; do
            [ -n "$t" ] || continue
            case "$t" in
              "v$CUR"|"nightly-v$CUR-"*) RELEASED=true; break ;;
            esac
          done <<EOF
          $(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          EOF

          if [ "$RELEASED" = false ]; then
            NEW="$CUR"
            echo "plist names $CUR and it has not been released -- releasing that"
          else
            NEW="$(awk -v v="$CUR" 'BEGIN {
              split(v, a, ".");
              major=a[1]+0; minor=a[2]+0; patch=a[3]+0;
              patch++;
              if (patch > 9) { patch=0; minor++; if (minor > 9) { minor=0; major++ } }
              printf "%d.%d.%d", major, minor, patch }')"
            echo "$CUR has already been released -- bumping to $NEW"
          fi

          for key in CFBundleShortVersionString CFBundleVersion; do
            plutil -replace "$key" -string "$NEW" Sources/Info.plist
          done
          plutil -lint Sources/Info.plist
          echo "app version: $NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$NEW" != "$CUR" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Fetch the engine bundle from the private engine repo
        # Makes a nightly behave like an official release: installer.sh finds the
        # engine inside Resources and sets it up offline instead of building or
        # downloading wine itself. Installing = replacing deps/wine-unified
        # wholesale, which is what installer.sh already does (rm -rf then extract).
        #
        # RELEASE_CI is the PAT that can read the engine repo -- it is private, so the
        # workflow's own GITHUB_TOKEN cannot see it. Absent secret = launcher-only build
        # rather than a hard failure, so a fork without the secret still produces a
        # usable nightly. It is only ever handed to gh through the environment (gh sends
        # it as a header); nothing here echoes it, and `set -x` is deliberately not used
        # in this step so it cannot reach the log.
        id: payload
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CI }}
          ENGINE_REPO: mont127/MacNdCheese-WineEngine-PRIVATE
          # The newest macOS an engine may REQUIRE (its LC_BUILD_VERSION minos). An engine
          # built against a newer SDK with no deployment target pinned inherits the build
          # machine's macOS: build-11 came out as minos 27.0 calling pipe2(), wich only
          # macOS 27's libSystem exports, so on 26 wine died loading its own ntdll.so.
          # Raise this only on purpose, when dropping support for the older macOS.
          ENGINE_MAX_MINOS: "26.0"
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::RELEASE_CI secret not set - building launcher-only (no bundled engine)"
            echo "bundled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Probe the exact permission this step needs -- LISTING RELEASES -- rather than
          # just "can I see the repo", and split the two failures apart, because they have
          # completely differant fixes and the bare "gh: Resource not accessible by
          # personal access token (HTTP 403)" names neither.
          #
          # On a fine-grained PAT, Administration and Contents are separate permissions
          # and repo metadata is readable with neither: a token that is even an ADMIN on
          # the repo still gets 403 on its releases unless Contents is granted, because
          # releases and their assets are Contents.
          if ! gh api "repos/$ENGINE_REPO/releases?per_page=1" --silent 2>/dev/null; then
            if gh api "repos/$ENGINE_REPO" --silent 2>/dev/null; then
              echo "::error::RELEASE_CI can see $ENGINE_REPO but is refused its releases. Grant the token 'Contents: Read-only' on that repo -- Administration/metadata permission does NOT cover releases."
            else
              echo "::error::RELEASE_CI cannot see $ENGINE_REPO at all. Fine-grained PATs are per-repository: add that repo under the token's 'Repository access' (then grant Contents: Read-only). A classic PAT needs the 'repo' scope. Also check the token has not expired."
            fi
            exit 1
          fi

          mkdir -p payload

          # The newest WORKING engine, not simply the newest one. Candidates come by ASSET
          # NAME rather than `--latest` (engine builds are often prereleases, and the repo
          # also publishes d3d-pack-only releases), newest first. Each is downloaded,
          # extracted and checked; the first that passes ships, and anything newer that
          # failed is skipped with a warning (and named in the release notes) instead of
          # either failing the whole nightly or -- worse -- shipping it. build-10 and
          # build-11 both went out without the gnutls closure, and build-11 cannot load
          # on macOS 26 at all; before this, one of those would have killed every nightly
          # until the engine was republished, or reached users as a wine with no TLS.
          CANDIDATES="$(gh api "repos/$ENGINE_REPO/releases?per_page=100" --paginate \
            --jq '[ .[] | . as $r
                    | ($r.assets[]? | select(.name | endswith("unified-osx64.tar.xz")))
                    | {tag: $r.tag_name, asset: .name,
                       at: ($r.published_at // $r.created_at)} ]
                  | sort_by(.at) | reverse | .[] | "\(.tag) \(.asset)"')"
          [ -n "$CANDIDATES" ] || { echo "::error::no unified engine asset found in $ENGINE_REPO"; exit 1; }

          # Prints why an extracted engine must not ship, or nothing if it is fine.
          # Checked on the extracted tree: that is what actually ships.
          engine_problem() {
            local E="$1" req bin m
            has() { [ -e "$E/$1" ]; }
            has_any() { for c in "$@"; do has "$c" && return 0; done; return 1; }
            # d3d slots are flat in pack layout 1 and per-backend dirs in layout 2
            has_any mnc-d3d/d3d11_dxmt.dll mnc-d3d/dxmt/d3d11.dll || { echo "dxmt d3d11 missing"; return; }
            has_any mnc-d3d/dxgi_dxmt.dll mnc-d3d/dxmt/dxgi.dll   || { echo "dxmt dxgi missing"; return; }
            # a pack missing half the D3DMetal runtime loads fine, then dies on
            # "Failed to dlopen D3DMetal" with no hint a file is missing
            for req in libd3dshared.dylib D3DMetal.framework; do
              has_any "mnc-d3d/$req" "mnc-d3d/d3dm/external/$req" "mnc-d3d/d3dm-gptk4/external/$req" \
                || { echo "$req missing"; return; }
            done
            for req in loader/wine server/wineserver dlls/ntdll/ntdll.so; do
              has "$req" || { echo "$req missing"; return; }
            done
            # secur32/crypt32 dlopen exactly this name; macOS has no system gnutls, so
            # without it wine has no TLS and Steam fails "needs to be online to update"
            has lib/libgnutls.30.dylib \
              || { echo "no gnutls closure (lib/libgnutls.30.dylib), so wine would have no TLS"; return; }
            for bin in loader/wine dlls/ntdll/ntdll.so; do
              m="$(otool -l "$E/$bin" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')"
              [ -n "$m" ] || continue
              if ! python3 -c 'import sys; v=lambda x: [int(p) for p in x.split(".")]; sys.exit(v(sys.argv[1]) > v(sys.argv[2]))' "$m" "$ENGINE_MAX_MINOS"; then
                echo "$bin requires macOS $m, above the supported floor ENGINE_MAX_MINOS=$ENGINE_MAX_MINOS"; return
              fi
            done
          }

          WORK="${RUNNER_TEMP:-/tmp}/engine-candidate"
          TAG="" SKIPPED="" N=0
          while read -r tag asset; do
            [ -n "$tag" ] || continue
            N=$((N+1)); [ "$N" -le 6 ] || break
            echo "trying engine release: $tag ($asset)"
            rm -rf "$WORK"; mkdir -p "$WORK/tree"
            if ! gh release download "$tag" --repo "$ENGINE_REPO" --pattern "$asset" --dir "$WORK" \
               || ! tar -xJf "$WORK/$asset" -C "$WORK/tree" --strip-components=1; then
              why="could not download or unpack $asset"
            else
              rm -f "$WORK/$asset"
              why="$(engine_problem "$WORK/tree")"
            fi
            if [ -z "$why" ]; then TAG="$tag"; break; fi
            echo "::warning::skipping engine $tag: $why"
            SKIPPED="${SKIPPED}- ${tag}: ${why}"$'\n'
          done <<< "$CANDIDATES"

          if [ -z "$TAG" ]; then
            echo "::error::no usable engine among the newest releases in $ENGINE_REPO:"
            printf '%s' "$SKIPPED"
            exit 1
          fi
          # Extracted into the payload rather than shipped as an archive: buildapp.sh
          # copies the payload verbatim into Resources, and an extracted
          # Resources/wine-unified is what WineVersionGate.bundledEngineAvailable looks
          # for, so the app runs the engine straight out of the bundle.
          mv "$WORK/tree" payload/wine-unified
          echo "engine release: $TAG"
          echo "engine_tag=$TAG" >> "$GITHUB_OUTPUT"
          { echo "engine_skipped<<SKIP_EOF"; printf '%s' "$SKIPPED"; echo "SKIP_EOF"; } >> "$GITHUB_OUTPUT"

          du -sh payload/*

      - name: Fetch AArchX (pinned)
        # AArchX is the experimental translator a bottle can pick instead of Rosetta
        # (Rosetta stays the default). buildapp.sh builds it from this checkout via
        # bundle-aarchx.sh. Pinned to a commit like every other download here; bump
        # AARCHX_REF to ship a newer one.
        env:
          AARCHX_REF: 3471bcf04b832d11296ddab87748d82f38038800
        run: |
          git clone --quiet --filter=blob:none https://github.com/mont127/AArchX.git aarchx-src
          git -C aarchx-src checkout --quiet --detach "$AARCHX_REF"
          echo "MNC_AARCHX_SRC=$PWD/aarchx-src" >> "$GITHUB_ENV"

      - name: Build universal DMG
        env:
          MNC_PAYLOAD_DIR: payload
        run: |
          chmod +x buildapp.sh
          bash buildapp.sh universal
          ls -la *.dmg

      - name: Fail if the DMG exceeds GitHub's 2 GB asset limit
        # A bundled nightly is ~1.9 GB; uploads over 2 GB are rejected outright and
        # the failure surfaces late and confusingly, so check it up front.
        #
        # The name has to be buildapp.sh's APP_NAME for `universal` -- the same file the
        # publish step uploads. Statting a name nothing produces, with `|| echo 0` to
        # swallow the miss, made this guard silently unable to ever fire.
        run: |
          set -euo pipefail
          DMG=MacNCheese-universal.dmg
          [ -f "$DMG" ] || { echo "::error::$DMG was not produced by buildapp.sh"; exit 1; }
          SZ=$(stat -f%z "$DMG")
          echo "DMG size: $((SZ/1048576)) MB"
          if [ "$SZ" -gt 2147483648 ]; then
            echo "::error::$DMG is $((SZ/1048576)) MB, over GitHub's 2048 MB asset limit"
            exit 1
          fi

      - name: Package AArchX for the in-app installer
        # The setup menu's AArchX entry (installer.sh install_aarchx) downloads this when
        # the app it runs in has no AArchX inside: ocerz as bundle-aarchx.sh built it, its
        # LICENSE, and the AArchX commit. A build whose AArchX failed publishes without it.
        run: |
          set -euo pipefail
          if [ -x aarchx-src/ocerz ] && lipo -archs aarchx-src/ocerz | grep -qw arm64; then
            mkdir -p aarchx-pkg
            cp aarchx-src/ocerz aarchx-pkg/ocerz
            [ -f aarchx-src/LICENSE ] && cp aarchx-src/LICENSE aarchx-pkg/LICENSE
            # native mode's runtime (API databases + guest C++ runtime), when it built
            if [ -d aarchx-src/runtime/apis/macos ] && [ -f aarchx-src/runtime/guest/usr/lib/libc++.1.dylib ]; then
              mkdir -p aarchx-pkg/runtime
              cp -R aarchx-src/runtime/apis aarchx-src/runtime/guest aarchx-pkg/runtime/
            fi
            git -C aarchx-src rev-parse HEAD > aarchx-pkg/VERSION
            tar -czf aarchx-arm64.tar.gz -C aarchx-pkg .
            ls -la aarchx-arm64.tar.gz
          else
            echo "::warning::no AArchX build to package; this release has no aarchx-arm64.tar.gz"
          fi

      - name: Compute tag and release notes
        id: tag
        env:
          ENGINE_TAG: ${{ steps.payload.outputs.engine_tag }}
          ENGINE_SKIPPED: ${{ steps.payload.outputs.engine_skipped }}
        run: |
          set -euo pipefail
          # The version is read from Sources/Info.plist -- the same single source of
          # truth bump-version.sh moves -- so a build is named with whatever the
          # odometer currently sits on (10.8.8 -> 10.8.9 -> 10.9.0 ...).
          VERSION="$(awk '/<key>CFBundleShortVersionString<\/key>/ { getline; gsub(/.*<string>|<\/string>.*/, ""); print; exit }' Sources/Info.plist)"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::could not read a X.Y.Z version out of Sources/Info.plist (got '$VERSION')"; exit 1 ;;
          esac

          # The TAG keeps its nightly- prefix so the cleanup step still recognises these,
          # and keeps date+sha so two builds of the same version can never collide. Only
          # the release TITLE is the pretty one.
          TAG="nightly-v$VERSION-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=MacNdCheese v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Not using generate_release_notes here: it diffs against the "previous
          # release", but the step below deletes the previous nightly before this
          # one publishes, so there's usually nothing relevant for it to diff
          # against — it was falling back to unrelated, much older history
          # instead of "what changed since yesterday's nightly."
          {
            echo "notes<<NOTES_EOF"
            echo "MacNdCheese v$VERSION — automated nightly build, universal (arm64 + x86_64) .dmg."
            echo ""
            echo "Built from $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"
            echo ""
            echo "https://github.com/${GITHUB_REPOSITORY}/commit/$(git rev-parse HEAD)"
            if [ -n "${ENGINE_TAG:-}" ]; then
              echo ""
              echo "Wine engine: ${ENGINE_TAG}"
            fi
            if [ -n "${ENGINE_SKIPPED:-}" ]; then
              echo ""
              echo "Newer engine releases skipped as unusable:"
              printf '%s\n' "$ENGINE_SKIPPED"
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete previous nightly prereleases
        # Keep only the one we're about to publish — otherwise these accumulate
        # forever, one per commit to main. Deletes both the release and its tag.
        # Only PRE-releases go: a nightly someone promoted to a full release (or
        # Latest) is a release now, and this step used to delete it anyway --
        # 11.2.6 was promoted to Latest and vanished with the next push to main.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("nightly-"))) | .tagName' \
          | while read -r old_tag; do
              echo "Deleting old nightly release: $old_tag"
              gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          # KEEP THIS TRUE unless you mean it: UpdateChecker.swift and the backend both
          # poll /releases/latest, wich GitHub defines as the newest NON-prerelease. This
          # flag is the only thing stopping an untested nightly from being auto-pushed to
          # every user as an in-app update.
          prerelease: true
          body: ${{ steps.tag.outputs.notes }}
          files: |
            MacNCheese-universal.dmg
            aarchx-arm64.tar.gz

      - name: Commit the version bump
        # Runs only after the release is published, so a failed build leaves the
        # odometer where it was. Pushing with the workflow's own GITHUB_TOKEN does not
        # start another workflow run, so this commit cannot retrigger the nightly.
        if: steps.version.outputs.changed == 'true'
        env:
          NEW: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Info.plist
          git commit -m "Bump version to $NEW" -m "Set by the nightly build for its release."
          # main can have moved while the DMG was building; rebase the one-file bump on
          # top rather than failing the run after the release is already out.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
